analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    dead_code: error
    unused_import: error
    unused_local_variable: error

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print
    - close_sinks
    - directives_ordering
    - no_leading_underscores_for_local_identifiers
    - prefer_final_locals
    - require_trailing_commas
    - unawaited_futures
